[package]
name = "onekvm-extension-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"

[build-dependencies]
cc = "=1.1.10"
pkg-config = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
