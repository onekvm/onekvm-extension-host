[package]
name = "onekvm-extension-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dbus = "0.9.7"
dbus-crossroads = "0.5.2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
